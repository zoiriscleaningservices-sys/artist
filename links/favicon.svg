<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121226"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0095f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#0095f6" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner specular reflection -->
  <path d="M4 18 C 4 8, 8 4, 18 4 L 46 4 C 56 4, 60 8, 60 18 C 50 14, 14 14, 4 18 Z" fill="rgba(255, 255, 255, 0.22)"/>
  
  <!-- 4E Official Typography -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1.5">4E</text>
  
  <!-- Accent cyan diamond dot -->
  <circle cx="50" cy="18" r="3" fill="#25f4ee"/>
</svg>
